name: Backup Firestore Giornaliero

on:
  schedule:
    - cron: '0 3 * * *'  # ogni notte alle 3:00 UTC (4:00 ora italiana)
  workflow_dispatch:      # avvio manuale

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo principale
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installa firebase-admin
        run: npm install firebase-admin

      - name: Esegui backup
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/firestore-backup.cjs

      - name: Push backup su repo privato
        env:
          TOKEN: ${{ secrets.BACKUP_REPO_TOKEN }}
        run: |
          git clone https://x-access-token:${TOKEN}@github.com/simeoliinfissi/infissipro-backups.git backup-repo
          cp -r backups/. backup-repo/backups/ 2>/dev/null || mkdir -p backup-repo/backups && cp -r backups/. backup-repo/backups/
          cd backup-repo
          git config user.name "InfissiPro Backup Bot"
          git config user.email "backup@infissipro.it"
          git add backups/
          git diff --staged --quiet || git commit -m "Backup automatico $(date +%Y-%m-%d)"
          git push
